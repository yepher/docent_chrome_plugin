<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Docent: microphone access</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #111827; --muted: #6b7280; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111318; --fg: #e5e7eb; --muted: #9ca3af; --accent: #818cf8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 420px; padding: 24px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: #fff; cursor: pointer; }
    #status { margin-top: 14px; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>🎤 Let Docent hear you</h1>
    <p>Chrome needs your OK once before the extension can use the microphone for voice questions. Audio goes only to your LiveKit project's speech-to-text while you're talking.</p>
    <button id="allow">Allow microphone</button>
    <div id="status"></div>
  </main>
  <script src="mic.js"></script>
</body>
</html>
